name: Tests

# Runs the test suite that doesn't require an LLM API key. Tests that call a
# real LLM (llm_client, pipeline end-to-end, prompt-injection checks) are
# gated behind LLM_API_KEY with pytest.mark.skipif and self-skip here, since
# no such secret is configured for this workflow — see CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default: this workflow only reads the repo and runs tests,
# it never needs to write anything.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-only PyTorch
        # Same reasoning as the Dockerfile: installing the CPU wheel first
        # keeps sentence-transformers from pulling PyPI's default torch
        # build, which bundles several hundred MB of unused NVIDIA/CUDA
        # packages on Linux and slows every CI run down for nothing.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        # The runner's Python ships an outdated setuptools with known
        # advisories; upgrade it so the audit below checks what we'd deploy.
        run: |
          pip install --upgrade pip "setuptools>=83"
          pip install -r requirements-dev.txt

      - name: Audit installed dependencies for known vulnerabilities
        # Fails the build (and so blocks merging) if any installed package has
        # a published advisory -- the same environment the tests just ran in.
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off

      - name: Run tests
        run: pytest -v

  e2e:
    # Not yet proven on a CI runner: report failures without blocking merges.
    continue-on-error: true
    # Browser end-to-end checks (tests/e2e): real server + Playwright Chromium,
    # LLM endpoints faked in the browser, so no API key is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies and Chromium
        run: |
          pip install --upgrade pip "setuptools>=83"
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        env:
          DOCULENS_E2E: "1"
        run: pytest tests/e2e -v
